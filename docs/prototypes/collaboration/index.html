<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness — shared swarm prototype</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./comments.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="prototype-header">
    <div>
      <h1>Shared swarm</h1>
      <p>Highlight a prompt or agent output → Comment → reply from the other view.</p>
      <p>Local simulation. No real agents or commands.</p>
    </div>
    <button id="reset-demo" type="button">Reset demo</button>
  </header>
  <main class="clients">
    <section class="client" data-client="left" aria-label="Your view">
      <div class="view-label"><strong>Your view</strong><span>Owner</span></div>
      <div class="workspace"></div>
    </section>
    <section class="client" data-client="right" aria-label="Teammate view">
      <label class="view-label" for="teammate-select"><strong>Teammate’s view</strong><select id="teammate-select"></select></label>
      <div class="workspace"></div>
    </section>
  </main>
  <dialog id="share-dialog">
    <header class="dialog-header"><h2>Share swarm</h2><button type="button" data-close-dialog aria-label="Close sharing">×</button></header>
    <div id="member-list"></div>
    <form id="invite-form">
      <label for="invite-name">Invite someone</label>
      <div class="invite-row">
        <input id="invite-name" name="name" placeholder="Name" required maxlength="32" autocomplete="off">
        <select id="invite-role" name="role" aria-label="Invitation permission">
          <option value="editor">Can work</option>
          <option value="viewer">Can view</option>
        </select>
      </div>
      <p class="hint">The invitation appears in the teammate view for you to try.</p>
      <p id="invite-error" class="error" role="alert"></p>
      <button type="submit">Invite</button>
    </form>
  </dialog>
  <button id="selection-comment" type="button" hidden>Comment</button>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
