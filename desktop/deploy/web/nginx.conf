# harness.autonomous.ai's browser app: the app's routes and nothing else. The website keeps downloads,
# /pair, /install.sh and its redirects; the ingress sends only these paths here.
#
# Cache rules are the website's (next.config.js), which the CDN in front relies on:
# - entry pages and release.json: no-store, so every load sees the current release;
# - /harness-web/releases/<version>-<sha12>/: immutable, since that URL never changes content;
# - unversioned /harness-web/ files, kept for tabs opened before a deployment: revalidate every time.

map $uri $harness_cache {
  ~^/harness-web/releases/                     "public, max-age=31536000, immutable";
  ~^/harness-web/(index\.html|release\.json)$  "no-store";
  ~^/harness-web/                              "public, max-age=0, must-revalidate";
  default                                      "no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Server-level only: an add_header inside a location would drop all of these for it.
  add_header Cache-Control $harness_cache always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # `/`, a shared link `/s/<id>`, the OAuth return (`/auth/callback`, and `/callback` for loopback
  # previews) and `/harness-web` all open the app; the base href keeps the visible URL.
  location ~ ^/(s/[^/]+|auth/callback|callback|harness-web)?/?$ {
    rewrite ^ /harness-web/index.html last;
  }

  location /harness-web/ {
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
